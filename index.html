<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="A free, minimal weather app powered by Open-Meteo — a nicer, quieter alternative to the default weather app."
    />

    <!-- Icons (the manifest link + SW registration are injected by vite-plugin-pwa) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nebel" />

    <!-- TODO: replace the https://nebel.pages.dev placeholder below with the real
         deploy URL before launch (used by canonical + Open Graph absolute links). -->
    <link rel="canonical" href="https://nebel.pages.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nebel" />
    <meta property="og:url" content="https://nebel.pages.dev/" />
    <meta property="og:title" content="Nebel — weather, quietly" />
    <meta
      property="og:description"
      content="A free, minimal weather app powered by Open-Meteo — a nicer, quieter alternative to the default weather app."
    />
    <meta property="og:image" content="https://nebel.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nebel — weather, quietly" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nebel — weather, quietly" />
    <meta
      name="twitter:description"
      content="A free, minimal weather app powered by Open-Meteo — a nicer, quieter alternative to the default weather app."
    />
    <meta name="twitter:image" content="https://nebel.pages.dev/og.png" />

    <title>Nebel</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
